<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Disaster Relief Task Coordination Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #f5f7fb; padding: 20px; }
    .dashboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
    .stat-card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .container { display: grid; grid-template-columns: 3fr 1fr; gap: 20px; }
    .toolbar { display: flex; justify-content: space-between; margin-bottom: 15px; }
    .filters button { margin-right: 8px; padding: 8px 12px; border: none; border-radius: 15px; cursor: pointer; }
    .task-grid { display: flex; flex-direction: column; gap: 12px; }
    .task-card, .volunteer-card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .task-card.critical { border-left: 5px solid red; }
    .task-card.high { border-left: 5px solid orange; }
    .task-card.medium { border-left: 5px solid green; }
    .status-btn { padding: 5px 10px; border-radius: 15px; border: none; cursor: pointer; }
    .pending { background: #fff3cd; color: #856404; }
    .active { background: #cce5ff; color: #004085; }
    .completed { background: #d4edda; color: #155724; }
    .assign-btn.disabled { opacity: 0.4; pointer-events: none; }
    .sidebar button, #newTaskBtn { margin-top: 10px; padding: 10px; width: 100%; cursor: pointer; }
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    .modal { background: white; padding: 20px; width: 400px; border-radius: 10px; }
    .modal input, .modal textarea, .modal select { width: 100%; margin: 8px 0; padding: 8px; }
    .error { color: red; font-size: 12px; }
  </style>
</head>
<body>
  <div class="dashboard">
    <div class="stat-card">Active Tasks: <span id="activeCount">0</span></div>
    <div class="stat-card">Critical Tasks: <span id="criticalCount">0</span></div>
    <div class="stat-card">Volunteers: <span id="volunteerCount">0</span></div>
    <div class="stat-card">Completed Today: <span id="completedCount">0</span></div>
  </div>

  <div class="container">
    <div>
      <div class="toolbar">
        <div class="filters">
          <button data-priority="all">All</button>
          <button data-priority="critical">Critical</button>
          <button data-priority="high">High</button>
          <button data-priority="medium">Medium</button>
        </div>
        <input type="text" id="searchInput" placeholder="Search tasks..." />
      </div>
      <div class="task-grid" id="taskGrid"></div>
      <button id="newTaskBtn">+ New Task</button>
    </div>

    <div class="sidebar">
      <div id="volunteerList"></div>
      <button id="registerVolunteerBtn">+ Register Volunteer</button>
    </div>
  </div>

  <div class="modal-backdrop" id="taskModalBackdrop">
    <div class="modal">
      <div style="display:flex;justify-content:space-between;align-items:center;"><h3>Create Task</h3><button id="closeTaskModal" style="border:none;background:none;font-size:20px;cursor:pointer;">&times;</button></div>
      <input id="taskTitle" placeholder="Task Title" />
      <div class="error" id="titleError"></div>
      <select id="taskPriority">
        <option value="critical">Critical</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
      </select>
      <textarea id="taskDescription" maxlength="200" placeholder="Description"></textarea>
      <div id="descCounter">200/200</div>
      <div class="error" id="descError"></div>
      <input id="minVolunteers" type="number" placeholder="Minimum Volunteers" />
      <button id="createTaskBtn">Create Task</button>
    </div>
  </div>

  <div class="modal-backdrop" id="volunteerModalBackdrop">
    <div class="modal">
      <div style="display:flex;justify-content:space-between;align-items:center;"><h3>Register Volunteer</h3><button id="closeVolunteerModal" style="border:none;background:none;font-size:20px;cursor:pointer;">&times;</button></div>
      <input id="volName" placeholder="Full Name" />
      <input id="volEmail" placeholder="Email" />
      <div>
        <label><input type="checkbox" value="first aid"> First Aid</label><br>
        <label><input type="checkbox" value="medical"> Medical</label><br>
        <label><input type="checkbox" value="logistics"> Logistics</label><br>
        <label><input type="checkbox" value="engineering"> Engineering</label><br>
        <label><input type="checkbox" value="search & rescue"> Search & Rescue</label>
      </div>
      <button id="submitVolunteerBtn">Register</button>
    </div>
  </div>

<script>
let tasks = [];
let volunteers = [];
let currentPriority = 'all';
let searchTerm = '';

function updateStats() {
  document.getElementById('activeCount').textContent = tasks.filter(t => t.status === 'active').length;
  document.getElementById('criticalCount').textContent = tasks.filter(t => t.priority === 'critical').length;
  document.getElementById('volunteerCount').textContent = volunteers.length;
  document.getElementById('completedCount').textContent = tasks.filter(t => t.status === 'completed').length;
}

function renderTasks() {
  const taskGrid = document.getElementById('taskGrid');
  taskGrid.innerHTML = '';
  tasks.filter(task =>
    (currentPriority === 'all' || task.priority === currentPriority) &&
    task.title.toLowerCase().includes(searchTerm.toLowerCase())
  ).forEach(task => {
    const card = document.createElement('div');
    card.className = `task-card ${task.priority}`;
    card.innerHTML = `
      <h4>${task.title}</h4>
      <p>${task.description}</p>
      <button class="status-btn ${task.status}">${task.status}</button>
      <button class="assign-btn ${task.status === 'completed' ? 'disabled' : ''}">+ Assign</button>
      <button class="delete-btn">Delete</button>
      <ul>${task.assignedVolunteers.map(v => `<li>${v}</li>`).join('')}</ul>
    `;

    card.querySelector('.status-btn').onclick = () => {
      const states = ['pending', 'active', 'completed'];
      task.status = states[(states.indexOf(task.status)+1)%3];
      renderTasks(); updateStats();
    };

    card.querySelector('.assign-btn').onclick = (e) => {
      if(task.status === 'completed') return;
      const dropdown = document.createElement('select');
      volunteers.filter(v => v.availability === 'available' && !task.assignedVolunteers.includes(v.name))
      .forEach(v => {
        const opt = document.createElement('option'); opt.value = v.name; opt.textContent = v.name; dropdown.appendChild(opt);
      });
      dropdown.onchange = () => {
        task.assignedVolunteers.push(dropdown.value);
        volunteers.find(v => v.name === dropdown.value).availability = 'on Task';
        renderTasks(); renderVolunteers();
      };
      e.target.replaceWith(dropdown);
    };

    card.querySelector('.delete-btn').onclick = () => {
      tasks = tasks.filter(t => t.id !== task.id);
      renderTasks(); updateStats();
    };

    taskGrid.prepend(card);
  });
}

function renderVolunteers() {
  const list = document.getElementById('volunteerList');
  list.innerHTML = '';
  volunteers.forEach(v => {
    const card = document.createElement('div');
    card.className = 'volunteer-card';
    card.innerHTML = `<strong>${v.name}</strong><p>${v.availability}</p>`;
    list.appendChild(card);
  });
  updateStats();
}

document.getElementById('newTaskBtn').onclick = () => taskModalBackdrop.style.display = 'flex';
document.getElementById('registerVolunteerBtn').onclick = () => volunteerModalBackdrop.style.display = 'flex';
document.getElementById('closeTaskModal').onclick = () => taskModalBackdrop.style.display = 'none';
document.getElementById('closeVolunteerModal').onclick = () => volunteerModalBackdrop.style.display = 'none';

document.getElementById('taskDescription').addEventListener('input', e => {
  document.getElementById('descCounter').textContent = `${200 - e.target.value.length}/200`;
});

document.getElementById('createTaskBtn').onclick = () => {
  const title = taskTitle.value.trim();
  const description = taskDescription.value.trim();
  if(title.length < 5) return titleError.textContent = 'Minimum 5 characters';
  if(description.length > 200) return descError.textContent = 'Max 200 characters';

  tasks.unshift({
    id: Date.now(),
    title,
    description,
    priority: taskPriority.value,
    status: 'pending',
    minVolunteers: minVolunteers.value,
    requiredSkills: [],
    assignedVolunteers: []
  });
  renderTasks(); updateStats();
  taskModalBackdrop.style.display = 'none';
};

document.getElementById('submitVolunteerBtn').onclick = () => {
  const skills = [...document.querySelectorAll('#volunteerModalBackdrop input[type=checkbox]:checked')].map(c => c.value);
  const email = volEmail.value.trim();
  if(!volName.value || !/^\S+@\S+\.\S+$/.test(email) || skills.length < 4) return;
  volunteers.push({ name: volName.value, email, skills, availability: 'available' });
  renderVolunteers();
  volunteerModalBackdrop.style.display = 'none';
};

document.querySelectorAll('.filters button').forEach(btn => btn.onclick = () => {
  currentPriority = btn.dataset.priority;
  renderTasks();
});

document.getElementById('searchInput').addEventListener('input', e => {
  searchTerm = e.target.value;
  renderTasks();
});
</script>
</body>
</html>
